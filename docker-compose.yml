services:
  postgres:
    image: postgres:16-alpine
    container_name: annotation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-annotation_db}
      POSTGRES_USER: ${POSTGRES_USER:-annotation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    ports:
      - "127.0.0.1:54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-annotation_user} -d ${POSTGRES_DB:-annotation_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annotation_migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    volumes:
      - ./admin_webpage/alembic:/app/alembic
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annotation_controller
    restart: unless-stopped
    command: ["uvicorn", "controller.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "${CONTROLLER_PORT:-8080}:8000"
    volumes:
      - ./secrets:/secrets
      - ./admin_webpage/controller:/app/controller
      - ./admin_webpage/sync_worker:/app/sync_worker
      - ./annotator_app/annotator_agent:/app/annotator_agent
      - ./scripts:/app/scripts
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  sync_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annotation_sync_worker
    restart: unless-stopped
    command: ["python", "-m", "sync_worker.worker"]
    env_file:
      - .env
    volumes:
      - ./secrets:/secrets
      - ./admin_webpage/controller:/app/controller
      - ./admin_webpage/sync_worker:/app/sync_worker
      - ./annotator_app/annotator_agent:/app/annotator_agent
      - ./scripts:/app/scripts
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_data:
