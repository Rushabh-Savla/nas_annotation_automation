name: Main System Integration CI

on:
  push:
    branches: [ developing, main ]
  pull_request:
    branches: [ developing, main ]

jobs:
  validate:
    name: Validate Submodules & Compose Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Submodule Directories
        run: |
          test -d admin_webpage/controller || exit 1
          test -d annotator_app/annotator_agent || exit 1
          echo "Submodules initialized and verified successfully"

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
